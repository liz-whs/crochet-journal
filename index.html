<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crochet Journal</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="container">

        <header class="cabecalho">

            <p class="comentario">
                // meu cantinho de crochê
            </p>

            <h1>Crochet Journal</h1>

            <p class="descricao">
                Guarde suas peças, receitas e projetos favoritos.
            </p>

        </header>


        <section class="resumo">

            <p class="comentario">
                // progresso geral
            </p>

            <div class="numero-projetos">
                <strong id="totalPecas">0</strong>
                <span>peças</span>
            </div>

            <div class="barra">
                <div class="barra-preenchida"></div>
            </div>

            <p id="textoResumo">
                seus projetos de crochê ficam salvos aqui ♡
            </p>

        </section>


        <section class="area-pecas">

            <div class="titulo-secao">
                <h2>// minhas peças</h2>
            </div>


            <div class="grid-pecas" id="gridPecas">

                <!-- JavaScript vai colocar os cards aqui -->

            </div>

        </section>

    </main>


    <script src="js/dados.js"></script>
    <script src="js/index.js"></script>

</body>

</html>
